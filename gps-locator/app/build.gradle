plugins { id 'com.android.application' }
android {
    namespace 'pl.homemind.garettgps'
    compileSdk 34
    // Sideload-only application for legacy Android 8.1 hardware; not distributed via Google Play.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'pl.homemind.garettgps'
        minSdk 26
        targetSdk 27
        versionCode 4
        versionName '0.1.3'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        debug { enableV1Signing true; enableV2Signing true }
        if (System.getenv('GPS_KEYSTORE')) {
            release {
                storeFile file(System.getenv('GPS_KEYSTORE'))
                storePassword System.getenv('GPS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GPS_KEY_ALIAS')
                keyPassword System.getenv('GPS_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('GPS_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
}
